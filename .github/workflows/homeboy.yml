name: Homeboy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: homeboy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Must match the reusable ci.yml's own permissions block, or GitHub rejects
# the run at startup.
permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  homeboy:
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@v2
    with:
      commands: review lint,review test
      scope: full
      differential-gating: 'true'
      baseline-commands: auto
    secrets: inherit
