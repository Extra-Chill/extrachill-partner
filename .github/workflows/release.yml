# Continuous release pipeline.
#
# Runs on every push to main. Homeboy derives the version from the
# conventional commits since the last tag (fix: -> patch, feat: -> minor,
# BREAKING CHANGE -> major; chore:/ci:/docs:/test: -> no release), runs the
# quality gates, then tags, writes docs/CHANGELOG.md, creates the GitHub
# Release and attaches the versioned plugin zip partners install.

name: Release

permissions:
  contents: write
  issues: write
  pull-requests: write
  # The shared release workflow declares id-token: write; a caller must grant
  # it or the run fails at startup with no log.
  id-token: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Preview the release without making changes'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: Extra-Chill/homeboy-action/.github/workflows/release.yml@v2
    with:
      dry-run: ${{ inputs.dry-run || false }}
    secrets: inherit
